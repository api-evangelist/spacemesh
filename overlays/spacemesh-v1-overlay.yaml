overlay: 1.0.0
info:
  title: API Evangelist enhancements for Spacemesh API (v1)
  version: 1.0.0
extends: openapi/spacemesh-v1-openapi-original.json
actions:
  - target: $.info
    update:
      x-apievangelist-enrichment: local-v1
      x-api-style: gRPC + grpc-gateway REST facade
