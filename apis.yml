aid: spacemesh
name: Spacemesh
description: >-
  Spacemesh is a permissionless, self-mining proof-of-space-time (PoST) layer-1
  blockchain built to run on ordinary home computers using unused disk space
  rather than specialized hardware or large capital stake. Its full-node
  software (go-spacemesh) exposes a gRPC API with a grpc-gateway REST/JSON
  facade for reading chain state — accounts, transactions, layers, rewards and
  activations (ATXs) — and for submitting transactions. Surfaced as a Paradigm
  portfolio company; the protocol, node, API design and developer tooling remain
  open source under the spacemeshos GitHub org, though the company's
  spacemesh.io / spacemesh.network web and hosted-API domains are now parked and
  the last node release was April 2025 (project appears dormant).
